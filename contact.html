<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Beyza Yılmaz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #263b45;
            background: #f4f7f2;
        }

        .page-frame {
            width: calc(100% - 60px);
            max-width: 1450px;
            min-height: 90vh;
            margin: 28px auto;
            padding: 0 38px 45px;
            border: 1px solid #e0e7e2;
            border-radius: 20px;
            background: #fff;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 30px 0;
            border-bottom: 1px solid #edf1ee;
        }

        .brand {
            color: #16865b;
            font-size: 19px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            position: relative;
            padding: 8px 0;
            color: #344b55;
            font-size: 15px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #16865b;
            font-weight: 600;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background: #16865b;
            transition: width 0.25s ease;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        /* Main contact layout */
        .content {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
            align-items: center;
            gap: 35px;
            max-width: 1320px;
            margin: 0 auto;
            padding: 65px 0 55px;
        }

        .contact-info {
            min-width: 0;
        }

        .eyebrow {
            color: #16865b;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        h1 {
            margin: 20px 0 18px;
            color: #203746;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 4.5vw, 68px);
            line-height: 1.1;
        }

        .title-line {
            width: 68px;
            height: 3px;
            margin: 25px 0 27px;
            border-radius: 3px;
            background: #16865b;
        }

        .intro {
            max-width: 570px;
            margin: 0;
            color: #687980;
            font-size: 17px;
            line-height: 1.8;
        }

        .contact-buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: 570px;
            margin-top: 35px;
        }

        .contact-button {
            display: flex;
            align-items: center;
            gap: 20px;
            min-height: 78px;
            padding: 18px 24px;
            border: 1px solid #d7e7dd;
            border-radius: 12px;
            color: #16865b;
            background: #fff;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }

        .contact-button:hover {
            background: #f3faf5;
            border-color: #a8d7bf;
            transform: translateY(-2px);
        }

        .contact-button svg {
            width: 29px;
            height: 29px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .contact-button .button-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .contact-button .arrow {
            width: 23px;
            height: 23px;
            flex-shrink: 0;
        }

        /* Map illustration on the right */
        .contact-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .contact-visual img {
            display: block;
            width: 100%;
            max-width: 600px;
            height: auto;
            object-fit: contain;
        }

        @media (max-width: 900px) {
            .page-frame {
                width: calc(100% - 32px);
                padding-right: 28px;
                padding-left: 28px;
            }

            nav {
                gap: 20px;
            }

            .nav-links {
                gap: 18px;
            }

            .content {
                grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr);
                gap: 22px;
                padding-top: 55px;
            }

            .contact-button {
                gap: 13px;
                padding: 16px;
                font-size: 15px;
            }

            .intro {
                font-size: 16px;
            }
        }

        @media (max-width: 700px) {
            .page-frame {
                width: calc(100% - 24px);
                margin: 12px auto;
                padding: 0 20px 30px;
            }

            nav {
                align-items: flex-start;
                flex-direction: column;
                gap: 18px;
                padding: 24px 0;
            }

            .nav-links {
                flex-wrap: wrap;
                gap: 12px 18px;
            }

            .nav-links a {
                font-size: 14px;
            }

            .content {
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 42px 0 20px;
            }

            h1 {
                margin-top: 16px;
                font-size: 44px;
            }

            .intro {
                font-size: 16px;
            }

            .contact-buttons {
                margin-top: 26px;
            }

            .contact-button {
                min-height: 68px;
                padding: 15px;
                font-size: 15px;
            }

            .contact-visual {
                width: 100%;
                max-width: 500px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>
    <div class="page-frame">

        <nav>
            <a class="brand" href="index.html">BEYZA YILMAZ</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="technologies.html">Technologies</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </nav>

        <main class="content">

            <section class="contact-info">
                <div class="eyebrow">GET IN TOUCH</div>

                <h1>Contact Me</h1>

                <div class="title-line"></div>

                <p class="intro">
                    Feel free to get in touch with me!<br>
                    If you have any questions, suggestions or opportunities,
                    I would be happy to hear from you.
                </p>

                <div class="contact-buttons">

                    <a class="contact-button"
                       href="mailto:byilmaz21@hacettepe.edu.tr">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="m4 7 8 6 8-6"/>
                        </svg>

                        <span class="button-text">
                            byilmaz21@hacettepe.edu.tr
                        </span>

                        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14M13 5l7 7-7 7"/>
                        </svg>
                    </a>

                    <a class="contact-button"
                       href="https://github.com/byzyiilmaz"
                       target="_blank"
                       rel="noopener noreferrer">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.1-1.5 6.1-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.7s-1.2-.4-3.8 1.4a13.2 13.2 0 0 0-6.9 0C5.4 1 4.2 1.4 4.2 1.4a4.8 4.8 0 0 0-.1 3.7 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.1 6.4 6.1 6.7a3.4 3.4 0 0 0-.9 2.7V22"/>
                        </svg>

                        <span class="button-text">GitHub</span>

                        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14M13 5l7 7-7 7"/>
                        </svg>
                    </a>

                </div>
            </section>

            <div class="contact-visual">
                <img src="images/connection.png"
                     alt="Layered GIS map illustration with geographic coordinates">
            </div>

        </main>
    </div>
</body>
</html>
